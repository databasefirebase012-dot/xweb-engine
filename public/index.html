<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0A0C11">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>XWEB ENGINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css?v=7">
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.169.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.169.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="fx" aria-hidden="true"></canvas>
<div class="grain" aria-hidden="true"></div>

<div class="app" id="app">

  <section class="scr" id="s-home">
    <div class="top"><div class="row">
      <div class="logo">
        <div class="mark"><span>X</span><i></i></div>
        <span class="brand">XWEB <b>ENGINE</b></span>
      </div>
      <div class="tools">
        <button class="ib pop" data-act="theme" id="th" aria-label="Theme"></button>
        <button class="ib pop" data-act="tab" data-v="cart" aria-label="Cart">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.4 12H6.4L5 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
          <span class="bd">0</span>
        </button>
      </div>
    </div></div>

    <div class="hero">
      <div class="hero-stage">
        <canvas class="hero3d" id="hero3d" aria-hidden="true"></canvas>
        <div class="hero-plane">
          <h1>
            <span class="l"><i>XWEB</i></span>
            <span class="l"><i>ENGINE</i></span>
            <span class="l sub"><i>XRANS OFFICIAL</i></span>
          </h1>
          <div class="pills" id="pills"></div>
        </div>
      </div>
      <div class="hb">
        <button class="bt g" data-act="tab" data-v="mod">
          <span>Jelajahi</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
        <button class="bt o" data-act="tab" data-v="orders">Pesanan</button>
      </div>
    </div>

    <div class="floats3d" id="floats3d" aria-hidden="true">
      <canvas class="float3d" data-shape="ico"></canvas>
      <canvas class="float3d" data-shape="octa"></canvas>
      <canvas class="float3d" data-shape="torus"></canvas>
    </div>

    <div id="hAnn"></div>
    <div id="hFeat"></div>
    <div id="hPop"></div>
    <div class="foot">© 2026 XWEB ENGINE · XRANS OFFICIAL</div>
  </section>

  <section class="scr" id="s-mod">
    <div class="top">
      <div class="ttl">Modul <small id="ct">0</small></div>
      <label class="sea">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
        <input id="q" placeholder="Cari modul" autocomplete="off">
      </label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gr" id="gr"></div>
  </section>

  <section class="scr" id="s-orders">
    <div class="top"><div class="ttl">Pesanan</div></div>
    <div id="oBox"></div>
  </section>

  <section class="scr" id="s-cart">
    <div class="top"><div class="ttl">Tas <small id="cn">0</small></div></div>
    <div class="cbox" id="cBox"></div>
  </section>

  <section class="scr push" id="s-detail"></section>
  <section class="scr push" id="s-checkout"></section>
  <section class="scr push" id="s-order"></section>

  <div id="toast"></div>
</div>

<!-- NAV dipindah ke LUAR .app supaya tidak rusak di Android WebView -->
<nav class="tb" id="tb"><div class="sl" id="tsl"></div>
  <button data-act="tab" data-v="home">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4v-9z"/></svg>
    <span>Beranda</span>
  </button>
  <button data-act="tab" data-v="mod">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>
    <span>Modul</span>
  </button>
  <button data-act="tab" data-v="orders">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>
    <span>Pesanan</span>
  </button>
  <button data-act="tab" data-v="cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.4 12H6.4L5 7z"/><path d="M9 7a3 3 0 016 0"/></svg>
    <span>Tas</span><span class="bd">0</span>
  </button>
</nav>

<script type="module" src="/app.js?v=7"></script>
<script type="module" src="/3d.js?v=7"></script>
</body>
</html>
