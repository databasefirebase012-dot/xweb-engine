<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#EFEFE7">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>XWEB ENGINE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<!-- Versi dinaikkan ke v5 untuk memaksa browser reset -->
<link rel="stylesheet" href="/style.css?v=6">
</head>
<body>
<div class="app" id="app">

  <section class="scr" id="s-home">
    <div class="top"><div class="row">
      <div class="logo"><div class="mark">X</div><span>XWEB <b>ENGINE</b></span></div>
      <div class="tools">
        <button class="ib pop" data-act="theme" id="th"></button>
        <button class="ib pop" data-act="tab" data-v="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.4 12H6.4L5 7z"/><path d="M9 7a3 3 0 016 0"/></svg><span class="bd">0</span></button>
      </div>
    </div></div>
    <div class="hero">
      <h1><span class="l"><i>Web Product,</i></span><span class="l"><i>XRANS</i></span><span class="l"><i>OFFICIAL.</i></span></h1>
      <div class="pills" id="pills"></div>
      <div class="hb"><button class="bt g" data-act="tab" data-v="mod">Jelajahi</button><button class="bt o" data-act="tab" data-v="orders">Pesanan</button></div>
    </div>
    <div id="hAnn"></div><div id="hFeat"></div><div id="hPop"></div>
    <div class="foot">© 2026 XWEB ENGINE · XRANS OFFICIAL</div>
  </section>

  <section class="scr" id="s-mod">
    <div class="top">
      <div class="ttl">Modul <small id="ct">0</small></div>
      <label class="sea"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg><input id="q" placeholder="Cari" autocomplete="off"></label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="gr" id="gr"></div>
  </section>

  <section class="scr" id="s-orders">
    <div class="top"><div class="ttl">Pesanan</div></div>
    <div id="oBox"></div>
  </section>

  <section class="scr" id="s-cart">
    <div class="top"><div class="ttl">Tas <small id="cn">0</small></div></div>
    <div class="cbox" id="cBox"></div>
  </section>

  <section class="scr push" id="s-detail"></section>
  <section class="scr push" id="s-checkout"></section>
  <section class="scr push" id="s-order"></section>

  <nav class="tb" id="tb"><div class="sl" id="tsl"></div>
    <button data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4v-9z"/></svg>Beranda</button>
    <button data-act="tab" data-v="mod"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="4" width="7" height="7" rx="2"/><rect x="4" y="13" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg>Modul</button>
    <button data-act="tab" data-v="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>Pesanan</button>
    <button data-act="tab" data-v="cart"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 7h14l-1.4 12H6.4L5 7z"/><path d="M9 7a3 3 0 016 0"/></svg>Tas<span class="bd">0</span></button>
  </nav>
  <div id="toast"></div>
</div>

<script type="module" src="/app.js?v=5"></script>
</body>
</html>
